name: "🧪 Klero Calcy Web - Build & Deploy to QA"

on:
  push:
    branches: [klero-qa]
    paths:
      - '.github/workflows/klero-calcy-web-qa.yaml'
  workflow_dispatch:
    inputs:
      commit_id:
        description: "Target commit ID from klero-frontend (leave blank to use env.COMMIT_ID)"
        required: false
        default: ""

env:
  COMMIT_ID: e2d2756b1904903039e5b06ce262a3b594c4a077
  REPO_FRONTEND: klero-organization/klero-frontend
  DOCKER_IMAGE_REPO: exchekhub/klero
  SSH_PORT: 22
  SVC: klero-calcy-web
  PORT: 3002

jobs:
  setup:
    name: "🔧 Checkout & Set Tag"
    runs-on: ubuntu-latest
    outputs:
      sha4: ${{ steps.tag.outputs.SHA4 }}
      commit_id: ${{ steps.resolve_commit.outputs.EFFECTIVE_COMMIT_ID }}
    steps:
      - name: Resolve Effective Commit ID
        id: resolve_commit
        run: |
          INPUT_CID="${{ github.event.inputs.commit_id }}"
          ENV_CID="${{ env.COMMIT_ID }}"
          EFFECTIVE="${INPUT_CID:-$ENV_CID}"
          echo "EFFECTIVE_COMMIT_ID=${EFFECTIVE}" >> $GITHUB_OUTPUT
          echo "🎯 Target Commit ID: ${EFFECTIVE:-latest HEAD}"

      - name: 📥 Checkout klero-frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_FRONTEND }}
          ref: dev_1.2
          token: ${{ secrets.KLERO_PAT_FOR_FETCH || secrets.KLERO_PAT || secrets.ZOY_PAT_FOR_FETCH_SC || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          path: klero-frontend

      - name: Reset to COMMIT_ID
        working-directory: klero-frontend
        env:
          TARGET_CID: ${{ steps.resolve_commit.outputs.EFFECTIVE_COMMIT_ID }}
        run: |
          git fetch --all
          if [ -n "$TARGET_CID" ]; then
            git checkout "$TARGET_CID" || (
              BRANCH=$(git branch -r --contains "$TARGET_CID" | grep -v '\->' | head -n 1 | sed 's/origin\///' | tr -d ' ')
              [ -z "$BRANCH" ] && echo "❌ Commit $TARGET_CID not found" && exit 1
              git checkout "$BRANCH" && git reset --hard "$TARGET_CID"
            )
          fi
          echo "✅ Checked out commit: $(git rev-parse HEAD)"

      - name: 🏷️ Set image tag (First 4 digits of commit)
        id: tag
        working-directory: klero-frontend
        run: |
          SHA4=$(git rev-parse HEAD | cut -c1-4)
          echo "SHA4=${SHA4}" >> $GITHUB_OUTPUT
          echo "🏷️ Image Tag SHA4: ${SHA4}"

  build_and_push:
    name: "🔨 Build & Push klero-calcy-web (QA)"
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: 📥 Checkout klero-frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_FRONTEND }}
          ref: dev_1.2
          token: ${{ secrets.KLERO_PAT_FOR_FETCH || secrets.KLERO_PAT || secrets.ZOY_PAT_FOR_FETCH_SC || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          path: klero-frontend

      - name: Reset to commit
        working-directory: klero-frontend
        env:
          TARGET_CID: ${{ needs.setup.outputs.commit_id }}
        run: |
          git fetch --all
          if [ -n "$TARGET_CID" ]; then
            git checkout "$TARGET_CID" || (
              BRANCH=$(git branch -r --contains "$TARGET_CID" | grep -v '\->' | head -n 1 | sed 's/origin\///' | tr -d ' ')
              [ -z "$BRANCH" ] && echo "❌ Commit not found" && exit 1
              git checkout "$BRANCH" && git reset --hard "$TARGET_CID"
            )
          fi
          echo "✅ Checked out commit: $(git rev-parse HEAD)"

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKERHUB_EXCHEK_USERNAME_PREPROD }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_EXCHEK_TOKEN_PREPROD }}

      - name: 📝 Configure Environment (.env) from Secret
        working-directory: klero-frontend/klero-calcy
        env:
          CALCY_ENV: ${{ secrets['klero-calcy-web-qa'] || secrets.KLERO_CALCY_WEB_QA || secrets.KLERO_CALCY_WEB_QA_ENV || secrets.KLERO_CALCY_QA }}
        run: |
          if [ -z "$CALCY_ENV" ]; then
            echo "❌ ERROR: Secret 'klero-calcy-web-qa' (or 'KLERO_CALCY_WEB_QA') is empty or not found in GitHub Secrets!"
            exit 1
          fi
          echo "✅ Injecting secret into .env file..."
          echo "$CALCY_ENV" | tr -d '\r' > .env
          echo "📄 .env file successfully created from secret (lines: $(wc -l < .env))"

      - name: 🔨 Build & Push klero-calcy-web (Expo Web via nginx)
        working-directory: klero-frontend/klero-calcy
        env:
          SHA4: ${{ needs.setup.outputs.sha4 }}
        run: |
          echo "🔧 Patching metro.config.js for Web tslib ES6 resolution..."
          cat > metro.patch.js << 'PATCH_EOF'
          const fs = require('fs');
          const metroFile = 'metro.config.js';
          let content = fs.readFileSync(metroFile, 'utf8');
          if (!content.includes('tslib.es6.js')) {
            const patchCode = `
          // Map tslib to its es6 build to fix "__extends of undefined" crash on Web
          const ALIASES = {
            tslib: "tslib/tslib.es6.js",
          };
          const defaultResolveRequest = config.resolver.resolveRequest;
          config.resolver.resolveRequest = (context, moduleName, platform) => {
            const target = ALIASES[moduleName] ?? moduleName;
            if (defaultResolveRequest) {
              return defaultResolveRequest(context, target, platform);
            }
            return context.resolveRequest(context, target, platform);
          };
          `;
            content = content.replace('module.exports = withNativeWind', patchCode + '\nmodule.exports = withNativeWind');
            fs.writeFileSync(metroFile, content);
            console.log('✅ metro.config.js successfully patched with tslib alias');
          }
          PATCH_EOF
          node metro.patch.js
          rm -f metro.patch.js

          echo "🔧 Patching dynamic require in app/home.tsx..."
          node -e 'const fs = require("fs"); const f = "app/home.tsx"; if(fs.existsSync(f)){ let c = fs.readFileSync(f, "utf8"); c = c.replace(/const TabsIndex = require\("\.\/\(tabs\)\/index"\)\.default;/, ""); if(!c.includes("import TabsIndex from")) { c = "import TabsIndex from \"./(tabs)/index\";\n" + c; } fs.writeFileSync(f, c); console.log("✅ Patched app/home.tsx with static TabsIndex import"); }'

          echo "🔧 Patching default background in global.css and app/_layout.tsx to prevent navigation white screen glitch..."
          node -e 'const fs=require("fs"); const f="global.css"; if(fs.existsSync(f)){ let c=fs.readFileSync(f,"utf8"); if(!c.includes("html, body, #root")) { c="html, body, #root { background-color: #F5F0FC; min-height: 100vh; }\n" + c; fs.writeFileSync(f, c); console.log("✅ Patched global.css default background"); } }'
          node -e 'const fs=require("fs"); const f="app/_layout.tsx"; if(fs.existsSync(f)){ let c=fs.readFileSync(f,"utf8"); c=c.replace(/contentStyle:\s*\{\s*backgroundColor:\s*"transparent"\s*\}/g, "contentStyle: { backgroundColor: \"#F5F0FC\" }"); fs.writeFileSync(f, c); console.log("✅ Patched app/_layout.tsx contentStyle background"); }'

          echo "📝 Creating embedded Dockerfile for klero-calcy-web..."
          cat > Dockerfile.calcy-web << 'DOCKERFILE'
          FROM node:20-alpine AS builder
          WORKDIR /app
          COPY . .

          RUN rm -f package-lock.json && \
              npm install --legacy-peer-deps --no-audit --no-fund

          # Ensure tslib and Tailwind CSS v3 for NativeWind compatibility
          RUN npm install tslib@^2.8.1 tailwindcss@3.4.17 --save-exact --legacy-peer-deps --no-audit --no-fund

          # Ensure metro.config.js has tslib alias inside container
          RUN node -e "const fs = require('fs'); let c = fs.readFileSync('metro.config.js', 'utf8'); if (!c.includes('tslib.es6.js')) { const p = '\nconst ALIASES = { tslib: \"tslib/tslib.es6.js\" };\nconst defResolve = config.resolver.resolveRequest;\nconfig.resolver.resolveRequest = (context, moduleName, platform) => {\n  const target = ALIASES[moduleName] ?? moduleName;\n  return defResolve ? defResolve(context, target, platform) : context.resolveRequest(context, target, platform);\n};\n'; fs.writeFileSync('metro.config.js', c.replace('module.exports = withNativeWind', p + '\nmodule.exports = withNativeWind')); }"

          RUN npx expo export --platform web

          FROM nginx:alpine
          RUN printf 'server {\n    listen 80;\n    location / {\n        root /usr/share/nginx/html;\n        index index.html;\n        try_files $uri $uri/ /index.html;\n    }\n}\n' > /etc/nginx/conf.d/default.conf
          COPY --from=builder /app/dist /usr/share/nginx/html
          EXPOSE 80
          CMD ["nginx", "-g", "daemon off;"]
          DOCKERFILE

          docker buildx build --platform linux/amd64 \
            -t ${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${{ env.SVC }}-qa \
            -t ${{ env.DOCKER_IMAGE_REPO }}:${{ env.SVC }}-${SHA4}-qa \
            --push -f Dockerfile.calcy-web .
          echo "✅ Pushed: ${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${{ env.SVC }}-qa"

  deploy:
    name: "🚀 Deploy klero-calcy-web to QA Server"
    runs-on: ubuntu-latest
    needs: [setup, build_and_push]
    steps:
      - name: 🔐 Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_KLERO_QA || secrets.SSH_PRIVATE_KEY_ZOY_QA || secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST_KLERO_QA || secrets.SSH_HOST_ZOY_QA || secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME_KLERO_QA || secrets.KLERO_SSH_USERNAME || secrets.SSH_USERNAME_ZOY_QA || 'ubuntu' }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          CLEAN_HOST=$(echo -n "$SSH_HOST" | xargs)
          CLEAN_USER=$(echo -n "$SSH_USERNAME" | xargs)

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "❌ ERROR: SSH_PRIVATE_KEY is empty. Check GitHub secrets (SSH_PRIVATE_KEY_KLERO_QA)!"
            exit 1
          fi
          if [ -z "$CLEAN_HOST" ]; then
            echo "❌ ERROR: SSH_HOST is empty. Check GitHub secrets (SSH_HOST_KLERO_QA)!"
            exit 1
          fi
          if [ -z "$CLEAN_USER" ]; then
            echo "❌ ERROR: SSH_USERNAME is empty. Check GitHub secrets (SSH_USERNAME_KLERO_QA)!"
            exit 1
          fi

          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          echo "" >> ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          touch ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keyscan -T 10 -p ${{ env.SSH_PORT }} -H "$CLEAN_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          cat > ~/.ssh/config << EOF
          Host target
            HostName $CLEAN_HOST
            User $CLEAN_USER
            Port ${{ env.SSH_PORT }}
            IdentityFile ~/.ssh/id_rsa
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 30
            ServerAliveCountMax 20
          EOF
          chmod 600 ~/.ssh/config

          echo "🔍 Testing SSH connection..."
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 target "echo '✅ SSH connected successfully as \$(whoami) on \$(hostname)'"

      - name: 🚀 Deploy klero-calcy-web (Port ${{ env.PORT }})
        env:
          SHA4: ${{ needs.setup.outputs.sha4 }}
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=20 target bash -s "$SHA4" << 'EOSSH'
            set -e
            SHA4="$1"
            SVC="klero-calcy-web"
            PORT=${{ env.PORT }}
            FULL_IMAGE="${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC}-qa"

            echo "[INFO] Deploying $SVC QA with image $FULL_IMAGE..."
            docker stop "$SVC" 2>/dev/null || true
            docker rm --force "$SVC" 2>/dev/null || true
            sleep 2
            echo "[INFO] Pulling fresh image $FULL_IMAGE..."
            docker pull "$FULL_IMAGE"
            docker run -d --name "$SVC" --restart unless-stopped \
              -p ${PORT}:80 "$FULL_IMAGE"
            echo "[INFO] Waiting 10s..."; sleep 10
            docker ps --filter "name=$SVC" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          EOSSH

  summary:
    name: "📋 Deployment Summary"
    runs-on: ubuntu-latest
    needs: [setup, deploy]
    if: always()
    steps:
      - name: Write GitHub summary
        env:
          SHA4: ${{ needs.setup.outputs.sha4 }}
          COMMIT_ID: ${{ needs.setup.outputs.commit_id }}
          STATUS: ${{ needs.deploy.result }}
        run: |
          echo "## 🧪 Klero Calcy Web - QA Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Service** | \`${{ env.SVC }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`qa\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Port** | \`${{ env.PORT }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **SHA4** | \`${SHA4}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${COMMIT_ID:-latest HEAD}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | \`${STATUS}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Access" >> $GITHUB_STEP_SUMMARY
          echo "- **Calcy Web (QA):** \`https://qa-calcy.klero.in\`" >> $GITHUB_STEP_SUMMARY

