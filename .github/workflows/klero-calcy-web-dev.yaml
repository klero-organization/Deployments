name: "🌐 Klero Calcy Web - Build & Deploy to Dev"

on:
  push:
    branches: [klero]
    paths:
      - '.github/workflows/klero-calcy-web-dev.yaml'
  workflow_dispatch:
    inputs:
      commit_id:
        description: "Target commit ID from klero-frontend (leave blank to use latest HEAD of dev_1.2)"
        required: false
        default: ""

env:
  COMMIT_ID: e3ebef5dcca4b2b403d57a4852524d05574f225a
  REPO_FRONTEND: klero-organization/klero-frontend
  DOCKER_IMAGE_REPO: exchekhub/klero
  SSH_PORT: 22
  SVC: klero-calcy-web
  PORT: 3002

jobs:
  setup:
    name: "🔧 Checkout & Set Tag"
    runs-on: ubuntu-latest
    outputs:
      sha4: ${{ steps.tag.outputs.SHA4 }}
      commit_id: ${{ steps.resolve_commit.outputs.EFFECTIVE_COMMIT_ID }}
    steps:
      - name: Resolve Effective Commit ID
        id: resolve_commit
        run: |
          INPUT_CID="${{ github.event.inputs.commit_id }}"
          ENV_CID="${{ env.COMMIT_ID }}"
          EFFECTIVE="${INPUT_CID:-$ENV_CID}"
          echo "EFFECTIVE_COMMIT_ID=${EFFECTIVE}" >> $GITHUB_OUTPUT
          echo "🎯 Target Commit ID: ${EFFECTIVE:-latest HEAD (dev_1.2)}"

      - name: 📥 Checkout klero-frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_FRONTEND }}
          ref: dev_1.2
          token: ${{ secrets.KLERO_PAT_FOR_FETCH || secrets.KLERO_PAT || secrets.ZOY_PAT_FOR_FETCH_SC || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          path: klero-frontend

      - name: Reset to COMMIT_ID
        working-directory: klero-frontend
        env:
          TARGET_CID: ${{ steps.resolve_commit.outputs.EFFECTIVE_COMMIT_ID }}
        run: |
          git fetch --all
          if [ -n "$TARGET_CID" ]; then
            git checkout "$TARGET_CID" || (
              BRANCH=$(git branch -r --contains "$TARGET_CID" | grep -v '\->' | head -n 1 | sed 's/origin\///' | tr -d ' ')
              [ -z "$BRANCH" ] && echo "❌ Commit $TARGET_CID not found" && exit 1
              git checkout "$BRANCH" && git reset --hard "$TARGET_CID"
            )
          fi
          echo "✅ Checked out commit: $(git rev-parse HEAD)"

      - name: 🏷️ Set image tag (First 4 digits of commit)
        id: tag
        working-directory: klero-frontend
        run: |
          SHA4=$(git rev-parse HEAD | cut -c1-4)
          echo "SHA4=${SHA4}" >> $GITHUB_OUTPUT
          echo "🏷️ Image Tag SHA4: ${SHA4}"

  build_and_push:
    name: "🔨 Build & Push klero-calcy-web (Next.js - klero-web)"
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: 📥 Checkout klero-frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_FRONTEND }}
          ref: dev_1.2
          token: ${{ secrets.KLERO_PAT_FOR_FETCH || secrets.KLERO_PAT || secrets.ZOY_PAT_FOR_FETCH_SC || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          path: klero-frontend

      - name: Reset to commit
        working-directory: klero-frontend
        env:
          TARGET_CID: ${{ needs.setup.outputs.commit_id }}
        run: |
          git fetch --all
          if [ -n "$TARGET_CID" ]; then
            git checkout "$TARGET_CID" || (
              BRANCH=$(git branch -r --contains "$TARGET_CID" | grep -v '\->' | head -n 1 | sed 's/origin\///' | tr -d ' ')
              [ -z "$BRANCH" ] && echo "❌ Commit not found" && exit 1
              git checkout "$BRANCH" && git reset --hard "$TARGET_CID"
            )
          fi
          echo "✅ Checked out commit: $(git rev-parse HEAD)"

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKERHUB_EXCHEK_USERNAME_PREPROD }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_EXCHEK_TOKEN_PREPROD }}

      - name: 🔨 Build & Push klero-calcy-web (Next.js - klero-web)
        working-directory: klero-frontend/klero-web
        env:
          SHA4: ${{ needs.setup.outputs.sha4 }}
        run: |
          echo "📝 Creating embedded Dockerfile for klero-web..."
          cat > Dockerfile.calcy-web << 'DOCKERFILE'
          FROM node:20-alpine AS builder
          WORKDIR /app
          COPY package*.json ./
          RUN npm install
          COPY . .
          ARG CALCY_APP_URL
          ENV CALCY_APP_URL=$CALCY_APP_URL
          RUN npm run build

          FROM node:20-alpine AS runner
          WORKDIR /app
          ENV NODE_ENV=production
          ENV PORT=3002
          ENV HOSTNAME="0.0.0.0"
          COPY --from=builder /app ./
          EXPOSE 3002
          CMD ["npm", "run", "start", "--", "-p", "3002"]
          DOCKERFILE

          echo "✅ Dockerfile.calcy-web created"
          ls -la Dockerfile.calcy-web

          echo "📂 Building ${{ env.SVC }} with embedded Dockerfile..."
          docker buildx build --platform linux/amd64 \
            --build-arg CALCY_APP_URL="${{ secrets.CALCY_APP_URL || 'https://dev-calcy.klero.in' }}" \
            -t ${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${{ env.SVC }} \
            -t ${{ env.DOCKER_IMAGE_REPO }}:${{ env.SVC }}-${SHA4} \
            --push -f Dockerfile.calcy-web .
          echo "✅ Pushed: ${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${{ env.SVC }}"

  deploy:
    name: "🚀 Deploy klero-calcy-web to Dev Server"
    runs-on: ubuntu-latest
    needs: [setup, build_and_push]
    steps:
      - name: 🔐 Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_ZOY_QA }}
          SSH_HOST: ${{  secrets.SSH_HOST_ZOY_QA }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME_ZOY_QA || 'ubuntu' }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          CLEAN_HOST=$(echo -n "$SSH_HOST" | xargs)
          CLEAN_USER=$(echo -n "$SSH_USERNAME" | xargs)

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "❌ ERROR: SSH_PRIVATE_KEY is empty."
            exit 1
          fi

          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          echo "" >> ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          cat > ~/.ssh/config << EOF
          Host target
            HostName $CLEAN_HOST
            User $CLEAN_USER
            Port ${{ env.SSH_PORT }}
            IdentityFile ~/.ssh/id_rsa
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 30
            ServerAliveCountMax 20
          EOF
          chmod 600 ~/.ssh/config

          echo "🔍 Testing SSH connection..."
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 target "echo '✅ SSH connected successfully as \$(whoami) on \$(hostname)'"

      - name: 🚀 Deploy klero-calcy-web (Port ${{ env.PORT }})
        env:
          SHA4: ${{ needs.setup.outputs.sha4 }}
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=20 target bash -s "$SHA4" << 'EOSSH'
            set -e
            SHA4="$1"
            SVC="klero-calcy-web"
            PORT=${{ env.PORT }}
            FULL_IMAGE="${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC}"

            echo "[INFO] Deploying $SVC with image $FULL_IMAGE..."

            echo "[INFO] Stopping existing $SVC container if running..."
            docker stop "$SVC" 2>/dev/null || true
            docker rm --force "$SVC" 2>/dev/null || true
            sleep 2

            echo "[INFO] Pulling fresh image $FULL_IMAGE..."
            docker pull "$FULL_IMAGE"

            echo "[INFO] Starting $SVC container on port $PORT..."
            docker run -d --name "$SVC" --restart unless-stopped \
              -e HOSTNAME="0.0.0.0" \
              -e PORT="${PORT}" \
              -p ${PORT}:${PORT} \
              "$FULL_IMAGE"

            echo "[INFO] Waiting 10s for startup..."
            sleep 10

            echo "[INFO] Verifying container status..."
            docker ps --filter "name=$SVC" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          EOSSH

  summary:
    name: "📋 Deployment Summary"
    runs-on: ubuntu-latest
    needs: [setup, deploy]
    if: always()
    steps:
      - name: Generate Summary Report
        env:
          SHA4: ${{ needs.setup.outputs.sha4 }}
          COMMIT_ID: ${{ needs.setup.outputs.commit_id }}
          STATUS: ${{ needs.deploy.result }}
        run: |
          echo "## 🌐 Klero Calcy Web - Dev Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Service** | \`${{ env.SVC }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Port** | \`${{ env.PORT }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`dev\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Tag (SHA4)** | \`${SHA4}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Commit** | \`${COMMIT_ID:-latest HEAD}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployment Status** | \`${STATUS}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Docker Image** | \`${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${{ env.SVC }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Access URLs:" >> $GITHUB_STEP_SUMMARY
          echo "- **Calcy Web (Dev):** \`https://dev-calcy.klero.in\`" >> $GITHUB_STEP_SUMMARY
