name: "📱 Klero Calcy APK - Build & Deploy to PROD"

on:
  push:
    branches: [klero]
    paths:
      - '.github/workflows/klero-calcy-apk-prod.yaml'
  workflow_dispatch:
    inputs:
      commit_id:
        description: "Target commit ID from klero-frontend (paste commit SHA here, or leave blank to use env.COMMIT_ID)"
        required: false
        default: ""
      build_type:
        description: "APK Build Type (release or debug)"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

env:
  # Target commit ID from klero-frontend (paste commit SHA here or pass via workflow_dispatch)
  COMMIT_ID: 93ce796c24a55a6adbd737e4c825f8fa9e1ad506
  # Source repository
  REPO_FRONTEND: klero-organization/klero-frontend
  PROD_APK_DIR: "/home/ubuntu/klero-apks"
  SSH_PORT: 22

jobs:
  build_apk:
    name: "🔨 Build Calcy APK"
    runs-on: ubuntu-latest
    outputs:
      apk_name: ${{ steps.bundle.outputs.APK_NAME }}
    steps:
      - name: Resolve Effective Commit ID
        id: resolve_commit
        run: |
          INPUT_CID="${{ github.event.inputs.commit_id }}"
          ENV_CID="${{ env.COMMIT_ID }}"
          EFFECTIVE="${INPUT_CID:-$ENV_CID}"
          echo "EFFECTIVE_COMMIT_ID=${EFFECTIVE}" >> $GITHUB_OUTPUT
          echo "🎯 Target Commit ID: ${EFFECTIVE:-latest HEAD}"

      - name: 📥 Checkout klero-frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_FRONTEND }}
          token: ${{ secrets.KLERO_PAT_FOR_FETCH || secrets.KLERO_PAT || secrets.ZOY_PAT_FOR_FETCH_SC || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          path: klero-frontend

      - name: Reset to COMMIT_ID
        working-directory: klero-frontend
        env:
          TARGET_CID: ${{ steps.resolve_commit.outputs.EFFECTIVE_COMMIT_ID }}
        run: |
          git fetch --all
          if [ -n "$TARGET_CID" ]; then
            git checkout "$TARGET_CID" || (
              BRANCH=$(git branch -r --contains "$TARGET_CID" | grep -v '\->' | head -n 1 | sed 's/origin\///' | tr -d ' ')
              [ -z "$BRANCH" ] && echo "❌ Commit $TARGET_CID not found" && exit 1
              git checkout "$BRANCH" && git reset --hard "$TARGET_CID"
            )
          fi
          echo "✅ Checked out commit: $(git rev-parse HEAD)"

      - name: 🏷️ Set image tag (First 4 digits of commit)
        id: tag
        working-directory: klero-frontend
        run: |
          SHA4=$(git rev-parse HEAD | cut -c1-4)
          echo "SHA4=${SHA4}" >> $GITHUB_OUTPUT
          echo "🏷️ Image Tag SHA4: ${SHA4}"

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🤖 Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 🔧 Install klero-calcy Dependencies
        working-directory: klero-frontend/klero-calcy
        run: |
          set -e

          # 1. Configure app.json: Android package & versionCode
          node -e '
            const fs = require("fs");
            const appPath = "./app.json";
            const app = JSON.parse(fs.readFileSync(appPath, "utf8"));
            app.expo = app.expo || {};
            app.expo.android = app.expo.android || {};
            if (!app.expo.android.package) app.expo.android.package = "com.klero.calcy";
            if (!app.expo.android.versionCode) app.expo.android.versionCode = 1;
            fs.writeFileSync(appPath, JSON.stringify(app, null, 2));
            console.log("✅ android.package:", app.expo.android.package);
          '

          # 2. Clean install dependencies standalone for klero-calcy
          rm -f package-lock.json
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install tailwindcss@3.4.17 --save-exact --no-audit --no-fund
          echo "✅ klero-calcy dependencies installed"

      - name: 🛠️ Prebuild Native Android Project
        working-directory: klero-frontend/klero-calcy
        env:
          NODE_PATH: ${{ github.workspace }}/klero-frontend/klero-calcy/node_modules:${{ github.workspace }}/klero-frontend/node_modules
        run: |
          npx expo prebuild --platform android --clean --no-install

          # Guarantee splashscreen_logo drawable exists
          DRAWABLE_DIR="android/app/src/main/res/drawable"
          mkdir -p "$DRAWABLE_DIR"
          if [ ! -f "$DRAWABLE_DIR/splashscreen_logo.png" ] && [ ! -f "$DRAWABLE_DIR/splashscreen_logo.xml" ]; then
            echo '<?xml version="1.0" encoding="utf-8"?><vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="200dp" android:height="200dp" android:viewportWidth="200" android:viewportHeight="200"></vector>' > "$DRAWABLE_DIR/splashscreen_logo.xml"
            echo "✅ Created fallback splashscreen_logo.xml"
          else
            echo "✅ splashscreen_logo drawable already exists"
          fi

      - name: 🚀 Compile APK with Gradle
        id: bundle
        working-directory: klero-frontend/klero-calcy/android
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
          SHA4: ${{ steps.tag.outputs.SHA4 }}
          NODE_PATH: ${{ github.workspace }}/klero-frontend/klero-calcy/node_modules:${{ github.workspace }}/klero-frontend/node_modules
        run: |
          chmod +x gradlew

          # Ensure gradle.properties ends with a newline before appending custom properties
          # to prevent corrupting expo-modules autolinking JSON array properties
          printf "\norg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m\n" >> gradle.properties
          printf "org.gradle.parallel=true\n" >> gradle.properties
          printf "reactNativeArchitectures=arm64-v8a,armeabi-v7a\n" >> gradle.properties
          echo "📄 Tail of gradle.properties:"
          tail -n 10 gradle.properties

          GRADLE_FLAGS="-PreactNativeArchitectures=arm64-v8a,armeabi-v7a --parallel --no-daemon --stacktrace --info"
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease $GRADLE_FLAGS
            RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            ./gradlew assembleDebug $GRADLE_FLAGS
            RAW_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi

          if [ -z "$RAW_APK" ] || [ ! -f "$RAW_APK" ]; then
            echo "❌ APK build output not found!"
            exit 1
          fi

          FINAL_APK_NAME="klero-calcy-${SHA4}-${BUILD_TYPE}.apk"
          cp "$RAW_APK" "$GITHUB_WORKSPACE/$FINAL_APK_NAME"
          echo "APK_NAME=${FINAL_APK_NAME}" >> $GITHUB_OUTPUT
          echo "✅ Built APK: ${FINAL_APK_NAME}"
          ls -lh "$GITHUB_WORKSPACE/$FINAL_APK_NAME"

      - name: 📤 Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.APK_NAME }}
          path: ${{ github.workspace }}/${{ steps.bundle.outputs.APK_NAME }}
          retention-days: 30

  deploy_to_prod:
    name: "🚀 Deploy APK to Production Server"
    runs-on: ubuntu-latest
    needs: build_apk
    steps:
      - name: 📥 Download Built APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_apk.outputs.apk_name }}
          path: ./artifacts

      - name: 🔑 Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.KLERO_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.KLERO_SSH_HOST}}
          SSH_USERNAME: ${{ secrets.KLERO_SSH_USERNAME}}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ env.SSH_PORT }} -H "$SSH_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config << EOF
          Host target
            HostName $SSH_HOST
            User $SSH_USERNAME
            Port ${{ env.SSH_PORT }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ServerAliveCountMax 20
          EOF

      - name: 📦 Transfer APK & Update Symlink on PROD
        env:
          APK_NAME: ${{ needs.build_apk.outputs.apk_name }}
          PROD_DIR: ${{ env.PROD_APK_DIR }}
        run: |
          echo "📁 Ensuring directory exists on PROD server: ${PROD_DIR}"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 target "mkdir -p ${PROD_DIR}"

          echo "🚀 Transferring ${APK_NAME} to target:${PROD_DIR}/"
          scp ./artifacts/${APK_NAME} target:${PROD_DIR}/${APK_NAME}

          echo "🔗 Updating symlink to latest APK..."
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 target bash -s << EOSSH
            cd "${PROD_DIR}"
            ln -sf "${APK_NAME}" "klero-calcy-latest.apk"
            echo ""
            echo "✅ Current APKs in ${PROD_DIR}:"
            ls -lh "${PROD_DIR}"
          EOSSH
