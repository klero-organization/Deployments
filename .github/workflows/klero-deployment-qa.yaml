      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKERHUB_EXCHEK_USERNAME_PREPROD }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_EXCHEK_TOKEN_PREPROD }}
      - name: Build & Push klero-calcy-service
        working-directory: klero-backend/klero-server
        env:
          SVC: klero-calcy-service
          SHA4: ${{ needs.setup.outputs.sha4 }}
        run: |
          if [ ! -d "$SVC" ]; then echo "[ERROR] Module $SVC not found"; exit 1; fi
          mvn -f pom.xml -U -B -DskipTests=true -Dspotless.check.skip=true -P${{ env.SPRING_PROFILE }} -pl ${SVC} -am clean package
          cat > Dockerfile.calcy << 'DOCKERFILE'
          FROM eclipse-temurin:17-jre
          WORKDIR /app
          COPY klero-calcy-service/target/*.jar app.jar
          EXPOSE 8089
          ENTRYPOINT ["java", "-Dspring.profiles.active=qa", "-jar", "app.jar"]
          DOCKERFILE
          docker buildx build --platform linux/amd64 \
            -t ${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC}-qa \
            -t ${{ env.DOCKER_IMAGE_REPO }}:${SVC}-${SHA4}-qa \
            --push -f Dockerfile.calcy .
          echo "[SUCCESS] Pushed: ${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC}-qa"

  # ============================================================
  # DEPLOY (sequential, after all builds pass)
  # ============================================================

  deploy:
    name: "🚀 Deploy All Services to QA"
    runs-on: ubuntu-latest
    needs:
      - setup
      - build_eureka
      - build_gateway
      - build_auth
      - build_admin
      - build_customer
      - build_advisor
      - build_notify
      - build_s3
      - build_calcy
    steps:
      - name: 🔐 Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_KLERO_QA }}
          SSH_HOST: ${{ secrets.SSH_HOST_KLERO_QA }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME_KLERO_QA }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          CLEAN_HOST=$(echo -n "$SSH_HOST" | xargs)
          CLEAN_USER=$(echo -n "$SSH_USERNAME" | xargs)

          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          echo "" >> ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          touch ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keyscan -T 10 -p ${{ env.SSH_PORT }} -H "$CLEAN_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          cat > ~/.ssh/config << EOF
          Host target
            HostName $CLEAN_HOST
            User $CLEAN_USER
            Port ${{ env.SSH_PORT }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ServerAliveCountMax 20
          EOF
          chmod 600 ~/.ssh/config

          echo "🔍 Testing SSH connection..."
          ssh -o ConnectTimeout=15 target "echo '✅ SSH connected successfully as \$(whoami) on \$(hostname)'"

      - name: 🛑 Stop all existing klero containers
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 target bash << 'EOSSH'
            echo "🛑 Stopping all klero-* containers (if any)..."
            docker ps -aq --filter "name=klero-" | xargs -r docker rm --force 2>/dev/null || true
            echo "⏳ Waiting 5s for ports to release..."
            sleep 5
            echo "✅ Ready for fresh deployment"
          EOSSH

      - name: 🚀 Deploy klero-eukea-service (Eureka :8761)
        env:
          SHA4: ${{ needs.setup.outputs.sha4 }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 target bash -s "$SHA4" << 'EOSSH'
            set -e; SHA4="$1"; SVC="klero-eukea-service"; PORT=8761
            FULL_IMAGE="${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC}-qa"
            docker rm --force "$SVC" 2>/dev/null || true
            docker pull "$FULL_IMAGE"
            docker run -d --name "$SVC" --network host --restart unless-stopped \
              -e SPRING_PROFILES_ACTIVE=qa -e SERVER_PORT=$PORT "$FULL_IMAGE"
            echo "⏳ Waiting 15s for Eureka..."; sleep 15
          EOSSH

      - name: 🚀 Deploy klero-gateway-service (:8080)
        env:
          SHA4: ${{ needs.setup.outputs.sha4 }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 target bash -s "$SHA4" << 'EOSSH'
            set -e; SHA4="$1"; SVC="klero-gateway-service"; PORT=8080
            FULL_IMAGE="${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC}-qa"
            docker rm --force "$SVC" 2>/dev/null || true
            docker pull "$FULL_IMAGE"
            docker run -d --name "$SVC" --network host --restart unless-stopped \
              -e SPRING_PROFILES_ACTIVE=qa -e SERVER_PORT=$PORT \
              -e EUREKA_CLIENT_SERVICEURL_DEFAULTZONE="http://localhost:8761/eureka/" \
              -e EUREKA_INSTANCE_PREFER_IP_ADDRESS=true "$FULL_IMAGE"
            sleep 5
          EOSSH

      - name: 🚀 Deploy klero-auth-service (:8086)
        env:
          SHA4: ${{ needs.setup.outputs.sha4 }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 target bash -s "$SHA4" << 'EOSSH'
            set -e; SHA4="$1"; SVC="klero-auth-service"; PORT=8086
            FULL_IMAGE="${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC}-qa"
            docker rm --force "$SVC" 2>/dev/null || true
            docker pull "$FULL_IMAGE"
            docker run -d --name "$SVC" --network host --restart unless-stopped \
              -e SPRING_PROFILES_ACTIVE=qa -e SERVER_PORT=$PORT \
              -e EUREKA_CLIENT_SERVICEURL_DEFAULTZONE="http://localhost:8761/eureka/" \
              -e EUREKA_INSTANCE_PREFER_IP_ADDRESS=true "$FULL_IMAGE"
            sleep 5
          EOSSH

      - name: 🚀 Deploy klero-admin-service (:8081)
        env:
          SHA4: ${{ needs.setup.outputs.sha4 }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 target bash -s "$SHA4" << 'EOSSH'
            set -e; SHA4="$1"; SVC="klero-admin-service"; PORT=8081
            FULL_IMAGE="${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC}-qa"
            docker rm --force "$SVC" 2>/dev/null || true
            docker pull "$FULL_IMAGE"
            docker run -d --name "$SVC" --network host --restart unless-stopped \
              -e SPRING_PROFILES_ACTIVE=qa -e SERVER_PORT=$PORT \
              -e EUREKA_CLIENT_SERVICEURL_DEFAULTZONE="http://localhost:8761/eureka/" \
              -e EUREKA_INSTANCE_PREFER_IP_ADDRESS=true "$FULL_IMAGE"
            sleep 5
          EOSSH

      - name: 🚀 Deploy klero-customer-service (:8082)
        env:
          SHA4: ${{ needs.setup.outputs.sha4 }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 target bash -s "$SHA4" << 'EOSSH'
            set -e; SHA4="$1"; SVC="klero-customer-service"; PORT=8082
            FULL_IMAGE="${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC}-qa"
            docker rm --force "$SVC" 2>/dev/null || true
            docker pull "$FULL_IMAGE"
            docker run -d --name "$SVC" --network host --restart unless-stopped \
              -e SPRING_PROFILES_ACTIVE=qa -e SERVER_PORT=$PORT \
              -e EUREKA_CLIENT_SERVICEURL_DEFAULTZONE="http://localhost:8761/eureka/" \
              -e EUREKA_INSTANCE_PREFER_IP_ADDRESS=true "$FULL_IMAGE"
            sleep 5
          EOSSH

      - name: 🚀 Deploy klero-advisor-service (:8083)
        env:
          SHA4: ${{ needs.setup.outputs.sha4 }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 target bash -s "$SHA4" << 'EOSSH'
            set -e; SHA4="$1"; SVC="klero-advisor-service"; PORT=8083
            FULL_IMAGE="${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC}-qa"
            docker rm --force "$SVC" 2>/dev/null || true
            docker pull "$FULL_IMAGE"
            docker run -d --name "$SVC" --network host --restart unless-stopped \
              -e SPRING_PROFILES_ACTIVE=qa -e SERVER_PORT=$PORT \
              -e EUREKA_CLIENT_SERVICEURL_DEFAULTZONE="http://localhost:8761/eureka/" \
              -e EUREKA_INSTANCE_PREFER_IP_ADDRESS=true "$FULL_IMAGE"
            sleep 5
          EOSSH

      - name: 🚀 Deploy klero-notify-service (:8084)
        env:
          SHA4: ${{ needs.setup.outputs.sha4 }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 target bash -s "$SHA4" << 'EOSSH'
            set -e; SHA4="$1"; SVC="klero-notify-service"; PORT=8084
            FULL_IMAGE="${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC}-qa"
            docker rm --force "$SVC" 2>/dev/null || true
            docker pull "$FULL_IMAGE"
            docker run -d --name "$SVC" --network host --restart unless-stopped \
              -e SPRING_PROFILES_ACTIVE=qa -e SERVER_PORT=$PORT \
              -e EUREKA_CLIENT_SERVICEURL_DEFAULTZONE="http://localhost:8761/eureka/" \
              -e EUREKA_INSTANCE_PREFER_IP_ADDRESS=true "$FULL_IMAGE"
            sleep 5
          EOSSH

      - name: 🚀 Deploy klero-s3-service (:8085)
        env:
          SHA4: ${{ needs.setup.outputs.sha4 }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 target bash -s "$SHA4" << 'EOSSH'
            set -e; SHA4="$1"; SVC="klero-s3-service"; PORT=8085
            FULL_IMAGE="${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC}-qa"
            docker rm --force "$SVC" 2>/dev/null || true
            docker pull "$FULL_IMAGE"
            docker run -d --name "$SVC" --network host --restart unless-stopped \
              -e SPRING_PROFILES_ACTIVE=qa -e SERVER_PORT=$PORT \
              -e EUREKA_CLIENT_SERVICEURL_DEFAULTZONE="http://localhost:8761/eureka/" \
              -e EUREKA_INSTANCE_PREFER_IP_ADDRESS=true "$FULL_IMAGE"
            sleep 5
          EOSSH

      - name: 🚀 Deploy klero-calcy-service (:8089)
        env:
          SHA4: ${{ needs.setup.outputs.sha4 }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 target bash -s "$SHA4" << 'EOSSH'
            set -e; SHA4="$1"; SVC="klero-calcy-service"; PORT=8089
            FULL_IMAGE="${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC}-qa"
            docker rm --force "$SVC" 2>/dev/null || true
            docker pull "$FULL_IMAGE"
            docker run -d --name "$SVC" --network host --restart unless-stopped \
              -e SPRING_PROFILES_ACTIVE=qa -e SERVER_PORT=$PORT \
              -e EUREKA_CLIENT_SERVICEURL_DEFAULTZONE="http://localhost:8761/eureka/" \
              -e EUREKA_INSTANCE_PREFER_IP_ADDRESS=true "$FULL_IMAGE"
            sleep 5
          EOSSH

  summary:
    name: "📋 QA Deployment Summary"
    runs-on: ubuntu-latest
    needs: [setup, deploy]
    if: always()
    steps:
      - name: 🔐 Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_KLERO_QA }}
          SSH_HOST: ${{ secrets.SSH_HOST_KLERO_QA }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME_KLERO_QA }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          CLEAN_HOST=$(echo -n "$SSH_HOST" | xargs)
          CLEAN_USER=$(echo -n "$SSH_USERNAME" | xargs)

          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          echo "" >> ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          touch ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keyscan -T 10 -p ${{ env.SSH_PORT }} -H "$CLEAN_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          cat > ~/.ssh/config << EOF
          Host target
            HostName $CLEAN_HOST
            User $CLEAN_USER
            Port ${{ env.SSH_PORT }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ServerAliveCountMax 20
          EOF
          chmod 600 ~/.ssh/config
      - name: Print container status
        run: |
          ssh -o ServerAliveInterval=30 target bash << 'EOSSH'
            echo "╔══════════════════════════════════════════════╗"
            echo "║      KLERO QA — Deployment Summary           ║"
            echo "╚══════════════════════════════════════════════╝"
            docker ps --filter "name=klero-" --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
          EOSSH
      - name: Write GitHub summary
        env:
          SHA4: ${{ needs.setup.outputs.sha4 }}
          COMMIT_ID: ${{ needs.setup.outputs.commit_id }}
          STATUS: ${{ needs.deploy.result }}
        run: |
          echo "## 🧪 Klero Backend QA Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`qa\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **SHA4 Tag** | \`${SHA4}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${COMMIT_ID:-latest}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | \`${STATUS}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 QA URLs" >> $GITHUB_STEP_SUMMARY
          echo "- **API / Backend:** \`https://qa-backend.klero.in\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend:** \`https://qa.klero.in\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Calcy Web:** \`https://qa-calcy.klero.in\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Eureka Dashboard:** \`https://qa-backend.klero.in/eureka/\`" >> $GITHUB_STEP_SUMMARY

