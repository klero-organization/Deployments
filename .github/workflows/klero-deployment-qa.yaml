name: "🧪 Klero Backend - Build & Deploy to QA"

on:
  push:
    branches: [klero-qa]
    paths:
      - '.github/workflows/klero-deployment-qa.yaml'
  workflow_dispatch:
    inputs:
      commit_id:
        description: "Target commit ID from klero-backend (leave blank to use env.COMMIT_ID)"
        required: false
        default: ""

env:
  COMMIT_ID: 94fc9a1fa8c668e2a026aadb3b6716f00bb4995f
  REPO: klero-organization/klero-backend
  SSH_PORT: 22
  DOCKER_IMAGE_REPO: exchekhub/klero
  SPRING_PROFILE: qa

jobs:
  setup:
    name: "🔧 Setup - Checkout & Set Tag"
    runs-on: ubuntu-latest
    outputs:
      sha4: ${{ steps.tag.outputs.SHA4 }}
      commit_id: ${{ steps.resolve_commit.outputs.EFFECTIVE_COMMIT_ID }}
    steps:
      - name: Resolve Effective Commit ID
        id: resolve_commit
        run: |
          INPUT_CID="${{ github.event.inputs.commit_id }}"
          ENV_CID="${{ env.COMMIT_ID }}"
          EFFECTIVE="${INPUT_CID:-$ENV_CID}"
          echo "EFFECTIVE_COMMIT_ID=${EFFECTIVE}" >> $GITHUB_OUTPUT
          echo "🎯 Target Commit ID: ${EFFECTIVE:-latest HEAD}"

      - name: Checkout klero-backend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          token: ${{ secrets.KLERO_PAT_FOR_FETCH || secrets.KLERO_PAT || secrets.ZOY_PAT_FOR_FETCH_SC || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          path: klero-backend

      - name: Reset to COMMIT_ID
        working-directory: klero-backend
        env:
          TARGET_CID: ${{ steps.resolve_commit.outputs.EFFECTIVE_COMMIT_ID }}
        run: |
          git fetch --all
          if [ -n "$TARGET_CID" ]; then
            BRANCH=$(git branch -r --contains "$TARGET_CID" | grep -v '\->' | head -n 1 \
              | sed 's/origin\///' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            [ -z "$BRANCH" ] && echo "[ERROR] Commit $TARGET_CID not found in any branch" && exit 1
            echo "[INFO] Branch: $BRANCH"
            git checkout "$BRANCH"
            git reset --hard "$TARGET_CID"
          fi

      - name: 🏷️ Set image tag (First 4 digits of commit)
        id: tag
        working-directory: klero-backend
        run: |
          SHA4=$(git rev-parse HEAD | cut -c1-4)
          echo "SHA4=${SHA4}" >> $GITHUB_OUTPUT
          echo "🏷️ SHA4: ${SHA4}"

      - name: List klero-server modules
        working-directory: klero-backend/klero-server
        run: ls -la

  # ============================================================
  # BUILD JOBS (all parallel)
  # ============================================================

  build_eureka:
    name: "🔨 Build - klero-eukea-service"
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          token: ${{ secrets.KLERO_PAT_FOR_FETCH || secrets.KLERO_PAT || secrets.ZOY_PAT_FOR_FETCH_SC || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          path: klero-backend
      - name: Reset to commit
        working-directory: klero-backend
        env:
          TARGET_CID: ${{ needs.setup.outputs.commit_id }}
        run: |
          git fetch --all
          if [ -n "$TARGET_CID" ]; then
            BRANCH=$(git branch -r --contains "$TARGET_CID" | grep -v '\->' | head -n 1 \
              | sed 's/origin\///' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            [ -z "$BRANCH" ] && echo '[ERROR] Commit not found' && exit 1
            git checkout "$BRANCH" && git reset --hard "$TARGET_CID"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKERHUB_EXCHEK_USERNAME_PREPROD }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_EXCHEK_TOKEN_PREPROD }}
      - name: Build & Push klero-eukea-service
        working-directory: klero-backend/klero-server
        env:
          SVC: klero-eukea-service
          SHA4: ${{ needs.setup.outputs.sha4 }}
        run: |
          if [ ! -d "$SVC" ]; then echo "[ERROR] Module $SVC not found"; exit 1; fi
          mvn -f pom.xml -U -B -DskipTests=true -Dspotless.check.skip=true -P${{ env.SPRING_PROFILE }} -pl ${SVC} -am clean package
          cat > Dockerfile.eureka << 'DOCKERFILE'
          FROM eclipse-temurin:17-jre
          WORKDIR /app
          COPY klero-eukea-service/target/*.jar app.jar
          EXPOSE 8761
          ENTRYPOINT ["java", "-Dspring.profiles.active=qa", "-jar", "app.jar"]
          DOCKERFILE
          docker buildx build --platform linux/amd64 \
            -t ${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC}-qa \
            -t ${{ env.DOCKER_IMAGE_REPO }}:${SVC}-${SHA4}-qa \
            --push -f Dockerfile.eureka .
          echo "[SUCCESS] Pushed: ${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC}-qa"

