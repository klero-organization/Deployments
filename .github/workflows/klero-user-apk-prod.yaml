name: "📱 Klero User APK - Build & Deploy to PROD"

on:
  push:
    branches: [klero]
    paths:
      - '.github/workflows/klero-user-apk-prod.yaml'
  workflow_dispatch:
    inputs:
      commit_id:
        description: "Target commit ID from klero-frontend (paste commit SHA here, or leave blank to use env.COMMIT_ID / latest default branch)"
        required: false
        default: ""
      build_type:
        description: "APK Build Type (release or debug)"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

env:
  # Target commit ID from klero-frontend (paste commit SHA here or pass via workflow_dispatch).
  # Leave empty to build the latest commit of the repo's default branch.
  COMMIT_ID: 2f7fd7f4f400cafaad6fce9f0d4a39ae8b79954e
  # Source repository
  REPO_FRONTEND: klero-organization/klero-frontend
  PROD_APK_DIR: "/home/ubuntu/klero-apks"
  SSH_PORT: 22
  # Android application ID, applied only if app.json doesn't already set one.
  # ⚠️ This is permanent once published to the Play Store — confirm before first release.
  ANDROID_PACKAGE: "com.klero.user"

jobs:
  build_apk:
    name: "🔨 Build Klero User APK"
    runs-on: ubuntu-latest
    outputs:
      apk_name: ${{ steps.bundle.outputs.APK_NAME }}
    steps:
      - name: Resolve Effective Commit ID
        id: resolve_commit
        run: |
          INPUT_CID="${{ github.event.inputs.commit_id }}"
          ENV_CID="${{ env.COMMIT_ID }}"
          EFFECTIVE="${INPUT_CID:-$ENV_CID}"
          echo "EFFECTIVE_COMMIT_ID=${EFFECTIVE}" >> $GITHUB_OUTPUT
          echo "🎯 Target Commit ID: ${EFFECTIVE:-latest HEAD}"

      - name: 📥 Checkout klero-frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_FRONTEND }}
          token: ${{ secrets.KLERO_PAT_FOR_FETCH || secrets.KLERO_PAT || secrets.ZOY_PAT_FOR_FETCH_SC || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          path: klero-frontend

      - name: Reset to COMMIT_ID
        working-directory: klero-frontend
        env:
          TARGET_CID: ${{ steps.resolve_commit.outputs.EFFECTIVE_COMMIT_ID }}
        run: |
          git fetch --all
          if [ -n "$TARGET_CID" ]; then
            git checkout "$TARGET_CID" || (
              BRANCH=$(git branch -r --contains "$TARGET_CID" | grep -v '\->' | head -n 1 | sed 's/origin\///' | tr -d ' ')
              [ -z "$BRANCH" ] && echo "❌ Commit $TARGET_CID not found" && exit 1
              git checkout "$BRANCH" && git reset --hard "$TARGET_CID"
            )
          fi
          echo "✅ Checked out commit: $(git rev-parse HEAD)"

      - name: 🏷️ Set image tag (First 4 digits of commit)
        id: tag
        working-directory: klero-frontend
        run: |
          SHA4=$(git rev-parse HEAD | cut -c1-4)
          echo "SHA4=${SHA4}" >> $GITHUB_OUTPUT
          echo "🏷️ Image Tag SHA4: ${SHA4}"

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🤖 Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # klero-user reads these at bundle time (Expo inlines EXPO_PUBLIC_* into
      # the JS). Without them the code silently falls back to the DEV backend,
      # so a PROD build fails fast if the API URL isn't configured.
      # Set them under the Deployments repo: Settings → Secrets and variables → Actions.
      # - name: 🔐 Write klero-user PROD environment (.env)
      #   working-directory: klero-frontend/klero-user
      #   env:
      #     EXPO_PUBLIC_API_URL: ${{ vars.KLERO_USER_PROD_API_URL || secrets.KLERO_USER_PROD_API_URL }}
      #     EXPO_PUBLIC_WEB_URL: ${{ vars.KLERO_USER_PROD_WEB_URL || secrets.KLERO_USER_PROD_WEB_URL }}
      #     EXPO_PUBLIC_HEALTH_CHECK_URL: ${{ vars.KLERO_USER_PROD_HEALTH_CHECK_URL || secrets.KLERO_USER_PROD_HEALTH_CHECK_URL }}
      #     EXPO_PUBLIC_CHECKIN_API_KEY: ${{ secrets.KLERO_USER_PROD_CHECKIN_API_KEY }}
      #   run: |
      #     set -e
      #     if [ -z "$EXPO_PUBLIC_API_URL" ]; then
      #       echo "❌ KLERO_USER_PROD_API_URL is not set (repo variable or secret). Refusing to build a PROD APK against the dev backend."
      #       exit 1
      #     fi
      #     : > .env
      #     for KEY in EXPO_PUBLIC_API_URL EXPO_PUBLIC_WEB_URL EXPO_PUBLIC_HEALTH_CHECK_URL EXPO_PUBLIC_CHECKIN_API_KEY; do
      #       VAL="${!KEY}"
      #       if [ -n "$VAL" ]; then
      #         echo "${KEY}=${VAL}" >> .env
      #         echo "✅ ${KEY} set"
      #       else
      #         echo "⚠️ ${KEY} not set — app falls back to its built-in default"
      #       fi
      #     done

      - name: 🔧 Install Dependencies (@klero/tools + klero-user)
        working-directory: klero-frontend
        run: |
          set -e

          # klero-user is an npm workspace member, but the repo has no root
          # lockfile (only klero-user/package-lock.json). Move the workspace
          # root aside so each package installs standalone and klero-user's
          # own lockfile is honoured (CI-only; nothing is committed).
          mv package.json package.json.ci-bak

          # ─────────────────────────────────────────────────────────────────
          # 1. Build the shared @klero/tools package (not published to npm).
          #
          #    CRITICAL: klero-user imports from @klero/tools' compiled dist/
          #    folder (dist/index.cjs / dist/index.js), NOT the TypeScript src.
          #    If dist/ is missing or stale the Metro bundler will fail with a
          #    module-not-found error at bundle time, even though npm install
          #    succeeds (it only links the folder, not the build output).
          #
          #    Rule: any change to packages/tools/src MUST be followed by
          #    `npm run build` here BEFORE the klero-user install step below.
          # ─────────────────────────────────────────────────────────────────
          cd packages/tools
          npm install --no-audit --no-fund
          npm run build
          # Hard-fail if the expected output is absent — catches build script
          # mis-configurations early rather than producing a silent DEV-only APK.
          test -f dist/index.cjs || (echo "❌ @klero/tools build failed: dist/index.cjs not found" && exit 1)
          echo "✅ @klero/tools built successfully"
          cd ../../klero-user

          # 2. Configure app.json (Android package & versionCode) and point
          #    @klero/tools at the local package instead of the npm registry.
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("./app.json", "utf8"));
            app.expo = app.expo || {};
            app.expo.android = app.expo.android || {};
            if (!app.expo.android.package) app.expo.android.package = process.env.ANDROID_PACKAGE;
            if (!app.expo.android.versionCode) app.expo.android.versionCode = 1;
            fs.writeFileSync("./app.json", JSON.stringify(app, null, 2));
            console.log("✅ android.package:", app.expo.android.package);

            const pkg = JSON.parse(fs.readFileSync("./package.json", "utf8"));
            pkg.dependencies["@klero/tools"] = "file:../packages/tools";
            fs.writeFileSync("./package.json", JSON.stringify(pkg, null, 2));
            console.log("✅ @klero/tools ->", pkg.dependencies["@klero/tools"]);
          '

          # 3. Install from the committed lockfile. `npm install` (not delete +
          #    reinstall) keeps every locked version and only adds the local
          #    @klero/tools link, so builds don't drift between runs.
          npm install --legacy-peer-deps --no-audit --no-fund
          echo "✅ klero-user dependencies installed (locked versions)"

      - name: 🛠️ Prebuild Native Android Project
        working-directory: klero-frontend/klero-user
        env:
          NODE_PATH: ${{ github.workspace }}/klero-frontend/klero-user/node_modules:${{ github.workspace }}/klero-frontend/node_modules
        run: |
          npx expo prebuild --platform android --clean --no-install

          # Guarantee splashscreen_logo drawable exists
          DRAWABLE_DIR="android/app/src/main/res/drawable"
          mkdir -p "$DRAWABLE_DIR"
          if [ ! -f "$DRAWABLE_DIR/splashscreen_logo.png" ] && [ ! -f "$DRAWABLE_DIR/splashscreen_logo.xml" ]; then
            echo '<?xml version="1.0" encoding="utf-8"?><vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="200dp" android:height="200dp" android:viewportWidth="200" android:viewportHeight="200"></vector>' > "$DRAWABLE_DIR/splashscreen_logo.xml"
            echo "✅ Created fallback splashscreen_logo.xml"
          else
            echo "✅ splashscreen_logo drawable already exists"
          fi

      - name: 🚀 Compile APK with Gradle
        id: bundle
        working-directory: klero-frontend/klero-user/android
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
          SHA4: ${{ steps.tag.outputs.SHA4 }}
          NODE_PATH: ${{ github.workspace }}/klero-frontend/klero-user/node_modules:${{ github.workspace }}/klero-frontend/node_modules
        run: |
          chmod +x gradlew

          # Ensure gradle.properties ends with a newline before appending custom properties
          # to prevent corrupting expo-modules autolinking JSON array properties
          printf "\norg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m\n" >> gradle.properties
          printf "org.gradle.parallel=true\n" >> gradle.properties
          printf "reactNativeArchitectures=arm64-v8a,armeabi-v7a\n" >> gradle.properties
          echo "📄 Tail of gradle.properties:"
          tail -n 10 gradle.properties

          GRADLE_FLAGS="-PreactNativeArchitectures=arm64-v8a,armeabi-v7a --parallel --no-daemon --stacktrace --info"
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease $GRADLE_FLAGS
            RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            ./gradlew assembleDebug $GRADLE_FLAGS
            RAW_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi

          if [ -z "$RAW_APK" ] || [ ! -f "$RAW_APK" ]; then
            echo "❌ APK build output not found!"
            exit 1
          fi

          FINAL_APK_NAME="klero-user-${SHA4}-${BUILD_TYPE}.apk"
          cp "$RAW_APK" "$GITHUB_WORKSPACE/$FINAL_APK_NAME"
          echo "APK_NAME=${FINAL_APK_NAME}" >> $GITHUB_OUTPUT
          echo "✅ Built APK: ${FINAL_APK_NAME}"
          ls -lh "$GITHUB_WORKSPACE/$FINAL_APK_NAME"

      - name: 📤 Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.APK_NAME }}
          path: ${{ github.workspace }}/${{ steps.bundle.outputs.APK_NAME }}
          retention-days: 30

  deploy_to_prod:
    name: "🚀 Deploy APK to Production Server"
    runs-on: ubuntu-latest
    needs: build_apk
    steps:
      - name: 📥 Download Built APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_apk.outputs.apk_name }}
          path: ./artifacts

      - name: 🔑 Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_PROD || secrets.SSH_PRIVATE_KEY_KLERO_PROD || secrets.SSH_PRIVATE_KEY_ZOY_QA || secrets.SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY_EXCHEK_PREPROD }}
          SSH_HOST: ${{ secrets.SSH_HOST_PROD || secrets.SSH_HOST_KLERO_PROD || secrets.SSH_HOST_ZOY_QA || secrets.SSH_HOST || secrets.SSH_HOST_EXCHEK_PREPROD }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME_PROD || secrets.SSH_USERNAME_KLERO_PROD || secrets.SSH_USERNAME_ZOY_QA || secrets.SSH_USERNAME || secrets.SSH_USERNAME_EXCHEK_PREPROD }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ env.SSH_PORT }} -H "$SSH_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config << EOF
          Host target
            HostName $SSH_HOST
            User $SSH_USERNAME
            Port ${{ env.SSH_PORT }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ServerAliveCountMax 20
          EOF

      - name: 📦 Transfer APK & Update Symlink on PROD
        env:
          APK_NAME: ${{ needs.build_apk.outputs.apk_name }}
          PROD_DIR: ${{ env.PROD_APK_DIR }}
        run: |
          echo "📁 Ensuring directory exists on PROD server: ${PROD_DIR}"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 target "mkdir -p ${PROD_DIR}"

          echo "🚀 Transferring ${APK_NAME} to target:${PROD_DIR}/"
          scp ./artifacts/${APK_NAME} target:${PROD_DIR}/${APK_NAME}

          echo "🔗 Updating symlink to latest APK..."
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 target bash -s << EOSSH
            cd "${PROD_DIR}"
            ln -sf "${APK_NAME}" "klero-user-latest.apk"
            echo ""
            echo "✅ Current APKs in ${PROD_DIR}:"
            ls -lh "${PROD_DIR}"
          EOSSH
