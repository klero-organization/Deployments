  deployment_summary:
    name: "Deployment Summary"
    runs-on: ubuntu-latest
    needs: [setup, deploy_all_services]
    if: always()
    steps:
      - name: Generate Summary Report
        env:
          SHA4: ${{ needs.setup.outputs.sha4 }}
          STATUS: ${{ needs.deploy_all_services.result }}
        run: |
          echo "## Klero Backend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** \`${{ env.SPRING_PROFILE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag (SHA4):** \`${SHA4}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Repository:** \`${{ env.DOCKER_IMAGE_REPO }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Status:** \`${STATUS}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Microservices Deployed (11 Services)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Port | Image |" >> $GITHUB_STEP_SUMMARY
