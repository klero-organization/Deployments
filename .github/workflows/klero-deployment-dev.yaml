  stop_all_klero:
    name: "Stop All Backend Containers"
    runs-on: ubuntu-latest
    needs:
      - build_eureka
      - build_gateway
      - build_auth
      - build_admin
      - build_customer
      - build_advisor
      - build_notify
      - build_calcy
      - build_ai_assistant
      - build_financial_engine
      - build_s3
      # - build_pg                  # disabled: klero-pg-service not deployed here
    steps:
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_ZOY_QA || secrets.SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY_EXCHEK_PREPROD }}
          SSH_HOST: ${{ secrets.SSH_HOST_ZOY_QA || secrets.SSH_HOST || secrets.SSH_HOST_EXCHEK_PREPROD }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME_ZOY_QA || secrets.SSH_USERNAME || secrets.SSH_USERNAME_EXCHEK_PREPROD }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ env.SSH_PORT }} -H "$SSH_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config << EOF
          Host target
            HostName $SSH_HOST
            User $SSH_USERNAME
            Port ${{ env.SSH_PORT }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ServerAliveCountMax 20
          EOF

      - name: Stop and remove all backend containers
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 target bash << 'EOSSH'
            echo "[INFO] Stopping all Klero backend containers..."
            for SVC in klero-eukea-service klero-gateway-service klero-auth-service klero-admin-service klero-customer-service klero-advisor-service klero-notify-service klero-calcy-service klero-ai-assistant-service klero-s3-service klero-financial-engine-service klero-pg-service klero-notification-service; do
              docker stop "$SVC" 2>/dev/null || true
              docker rm --force "$SVC" 2>/dev/null || true
            done
            sleep 5
          EOSSH

  deploy_all_services:
    name: "Deploy All Backend Services"
    runs-on: ubuntu-latest
    needs: [setup, stop_all_klero]
    steps:
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_ZOY_QA || secrets.SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY_EXCHEK_PREPROD }}
          SSH_HOST: ${{ secrets.SSH_HOST_ZOY_QA || secrets.SSH_HOST || secrets.SSH_HOST_EXCHEK_PREPROD }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME_ZOY_QA || secrets.SSH_USERNAME || secrets.SSH_USERNAME_EXCHEK_PREPROD }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ env.SSH_PORT }} -H "$SSH_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config << EOF
          Host target
            HostName $SSH_HOST
            User $SSH_USERNAME
            Port ${{ env.SSH_PORT }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ServerAliveCountMax 20
          EOF

      - name: Deploy klero-eukea-service (8761)
        env:
          SHA4: ${{ needs.setup.outputs.sha4 }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 target bash -s "$SHA4" << 'EOSSH'
            set -e
            SHA4="$1"
            SVC="klero-eukea-service"
            PORT=8761
            FULL_IMAGE="${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC}"
            docker stop "$SVC" 2>/dev/null || true
            docker rm --force "$SVC" 2>/dev/null || true
            sleep 3
            docker pull "$FULL_IMAGE"
            docker run -d --name "$SVC" --network host --restart unless-stopped \
              -e SPRING_PROFILES_ACTIVE=${{ env.SPRING_PROFILE }} \
              -e SERVER_PORT=$PORT \
              "$FULL_IMAGE"
            echo "[INFO] Waiting 15s for Eureka to initialize..."
            sleep 15
          EOSSH

      - name: Deploy klero-gateway-service (8080)
