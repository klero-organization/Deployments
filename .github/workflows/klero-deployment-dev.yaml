name: Klero Dev Deployment (Core Services)

on:
  push:
    branches: [klero]
    paths:
      - '.github/workflows/klero-deployment-de.yaml'
  workflow_dispatch:

env:
  COMMIT_ID: "7fd61c0be6d4339892c33c97ed09a9b864351335"
  REPO: klero-organization/klero-backend
  SSH_PORT: 22
  DOCKER_IMAGE_REPO: exchekhub/klero
  SPRING_PROFILE: dev

jobs:
  setup:
    name: "🔧 Checkout & Set Tag"
    runs-on: ubuntu-latest
    outputs:
      sha4: ${{ steps.tag.outputs.SHA4 }}
      commit_id: ${{ env.COMMIT_ID }}
    steps:
      - name: Checkout klero-backend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          token: ${{ secrets.GH_PAT_FOR_FETCH || secrets.ZOY_PAT_FOR_FETCH_SC || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          path: klero-backend

      - name: Reset to COMMIT_ID
        working-directory: klero-backend
        env:
          TARGET_CID: ${{ steps.resolve_commit.outputs.EFFECTIVE_COMMIT_ID }}
        run: |
          git fetch --all
          if [ -n "$TARGET_CID" ]; then
            BRANCH=$(git branch -r --contains "$TARGET_CID" | grep -v '\->' | head -n 1 \
              | sed 's/origin\///' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            [ -z "$BRANCH" ] && echo "❌ Commit $TARGET_CID not found in any branch" && exit 1
            echo "✅ Branch found: $BRANCH"
            git checkout "$BRANCH"
            git reset --hard "$TARGET_CID"
          fi

      - name: Set image tag (First 4 digits of commit)
        id: tag
        working-directory: klero-backend
        run: |
          SHA4=$(git rev-parse HEAD | cut -c1-4)
          echo "SHA4=${SHA4}" >> $GITHUB_OUTPUT
          echo "🏷️ First 4 digits of commit: ${SHA4}"

      - name: List klero-server modules
        working-directory: klero-backend/klero-server
        run: |
          echo "📁 Core modules available:"
          ls -1

  build_eureka:
    name: "🔨 Build klero-eukea-service"
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          token: ${{ secrets.GH_PAT_FOR_FETCH || secrets.ZOY_PAT_FOR_FETCH_SC || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          path: klero-backend
      - name: Reset to commit
        working-directory: klero-backend
        env:
          TARGET_CID: ${{ needs.setup.outputs.commit_id }}
        run: |
          git fetch --all
          if [ -n "$TARGET_CID" ]; then
            BRANCH=$(git branch -r --contains "$TARGET_CID" | grep -v '\->' | head -n 1 \
              | sed 's/origin\///' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            [ -z "$BRANCH" ] && echo '❌ Commit not found' && exit 1
            git checkout "$BRANCH" && git reset --hard "$TARGET_CID"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKERHUB_EXCHEK_USERNAME_PREPROD }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_EXCHEK_TOKEN_PREPROD }}
      - name: Build & Push klero-eukea-service
        working-directory: klero-backend/klero-server
        env:
          SVC: klero-eukea-service
          SHA4: ${{ needs.setup.outputs.sha4 }}
        run: |
          if [ ! -d "$SVC" ]; then echo "⚠️ Module $SVC not found — skipping"; exit 0; fi

          mvn -f pom.xml -U -B -DskipTests=true -P${{ env.SPRING_PROFILE }} -pl ${SVC} -am clean package

          cat > Dockerfile.eureka << 'DOCKERFILE'
          FROM eclipse-temurin:17-jre
          WORKDIR /app
          COPY klero-eukea-service/target/*.jar app.jar
          EXPOSE 8761
          ENTRYPOINT ["java", "-Dspring.profiles.active=dev", "-jar", "app.jar"]
          DOCKERFILE

          docker buildx build --platform linux/amd64 \
            -t ${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC} \
            -t ${{ env.DOCKER_IMAGE_REPO }}:${SVC}-${SHA4} \
            --push -f Dockerfile.eureka .
          echo "✅ Pushed: ${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC}"

  build_gateway:
    name: "🔨 Build klero-gateway-service"
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          token: ${{ secrets.GH_PAT_FOR_FETCH || secrets.ZOY_PAT_FOR_FETCH_SC || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          path: klero-backend
      - name: Reset to commit
        working-directory: klero-backend
        env:
          TARGET_CID: ${{ needs.setup.outputs.commit_id }}
        run: |
          git fetch --all
          if [ -n "$TARGET_CID" ]; then
            BRANCH=$(git branch -r --contains "$TARGET_CID" | grep -v '\->' | head -n 1 \
              | sed 's/origin\///' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            [ -z "$BRANCH" ] && echo '❌ Commit not found' && exit 1
            git checkout "$BRANCH" && git reset --hard "$TARGET_CID"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKERHUB_EXCHEK_USERNAME_PREPROD }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_EXCHEK_TOKEN_PREPROD }}
      - name: Build & Push klero-gateway-service
        working-directory: klero-backend/klero-server
        env:
          SVC: klero-gateway-service
          SHA4: ${{ needs.setup.outputs.sha4 }}
        run: |
          if [ ! -d "$SVC" ]; then echo "⚠️ Module $SVC not found — skipping"; exit 0; fi

          mvn -f pom.xml -U -B -DskipTests=true -P${{ env.SPRING_PROFILE }} -pl ${SVC} -am clean package

          cat > Dockerfile.gateway << 'DOCKERFILE'
          FROM eclipse-temurin:17-jre
          WORKDIR /app
          COPY klero-gateway-service/target/*.jar app.jar
          EXPOSE 8080
          ENTRYPOINT ["java", "-Dspring.profiles.active=dev", "-jar", "app.jar"]
          DOCKERFILE

          docker buildx build --platform linux/amd64 \
            -t ${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC} \
            -t ${{ env.DOCKER_IMAGE_REPO }}:${SVC}-${SHA4} \
            --push -f Dockerfile.gateway .
          echo "✅ Pushed: ${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC}"

  build_auth:
    name: "🔨 Build klero-auth-service"
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          token: ${{ secrets.GH_PAT_FOR_FETCH || secrets.ZOY_PAT_FOR_FETCH_SC || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          path: klero-backend
      - name: Reset to commit
        working-directory: klero-backend
        env:
          TARGET_CID: ${{ needs.setup.outputs.commit_id }}
        run: |
          git fetch --all
          if [ -n "$TARGET_CID" ]; then
            BRANCH=$(git branch -r --contains "$TARGET_CID" | grep -v '\->' | head -n 1 \
              | sed 's/origin\///' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            [ -z "$BRANCH" ] && echo '❌ Commit not found' && exit 1
            git checkout "$BRANCH" && git reset --hard "$TARGET_CID"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKERHUB_EXCHEK_USERNAME_PREPROD }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_EXCHEK_TOKEN_PREPROD }}
      - name: Build & Push klero-auth-service
        working-directory: klero-backend/klero-server
        env:
          SVC: klero-auth-service
          SHA4: ${{ needs.setup.outputs.sha4 }}
        run: |
          if [ ! -d "$SVC" ]; then echo "⚠️ Module $SVC not found — skipping"; exit 0; fi

          mvn -f pom.xml -U -B -DskipTests=true -P${{ env.SPRING_PROFILE }} -pl ${SVC} -am clean package

          cat > Dockerfile.auth << 'DOCKERFILE'
          FROM eclipse-temurin:17-jre
          WORKDIR /app
          COPY klero-auth-service/target/*.jar app.jar
          EXPOSE 8086
          ENTRYPOINT ["java", "-Dspring.profiles.active=dev", "-jar", "app.jar"]
          DOCKERFILE

          docker buildx build --platform linux/amd64 \
            -t ${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC} \
            -t ${{ env.DOCKER_IMAGE_REPO }}:${SVC}-${SHA4} \
            --push -f Dockerfile.auth .
          echo "✅ Pushed: ${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC}"

  build_customer:
    name: "🔨 Build klero-customer-service"
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          token: ${{ secrets.GH_PAT_FOR_FETCH || secrets.ZOY_PAT_FOR_FETCH_SC || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          path: klero-backend
      - name: Reset to commit
        working-directory: klero-backend
        env:
          TARGET_CID: ${{ needs.setup.outputs.commit_id }}
        run: |
          git fetch --all
          if [ -n "$TARGET_CID" ]; then
            BRANCH=$(git branch -r --contains "$TARGET_CID" | grep -v '\->' | head -n 1 \
              | sed 's/origin\///' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            [ -z "$BRANCH" ] && echo '❌ Commit not found' && exit 1
            git checkout "$BRANCH" && git reset --hard "$TARGET_CID"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKERHUB_EXCHEK_USERNAME_PREPROD }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_EXCHEK_TOKEN_PREPROD }}
      - name: Build & Push klero-customer-service
        working-directory: klero-backend/klero-server
        env:
          SVC: klero-customer-service
          SHA4: ${{ needs.setup.outputs.sha4 }}
        run: |
          if [ ! -d "$SVC" ]; then echo "⚠️ Module $SVC not found — skipping"; exit 0; fi

          mvn -f pom.xml -U -B -DskipTests=true -P${{ env.SPRING_PROFILE }} -pl ${SVC} -am clean package

          cat > Dockerfile.customer << 'DOCKERFILE'
          FROM eclipse-temurin:17-jre
          WORKDIR /app
          COPY klero-customer-service/target/*.jar app.jar
          EXPOSE 8082
          ENTRYPOINT ["java", "-Dspring.profiles.active=dev", "-jar", "app.jar"]
          DOCKERFILE

          docker buildx build --platform linux/amd64 \
            -t ${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC} \
            -t ${{ env.DOCKER_IMAGE_REPO }}:${SVC}-${SHA4} \
            --push -f Dockerfile.customer .
          echo "✅ Pushed: ${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC}"

  stop_core_klero:
    name: "🛑 Stop Core Klero Containers"
    runs-on: ubuntu-latest
    needs:
      - build_eureka
      - build_gateway
      - build_auth
      - build_customer
    steps:
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_ZOY_QA || secrets.SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY_EXCHEK_PREPROD }}
          SSH_HOST: ${{ secrets.SSH_HOST_ZOY_QA || secrets.SSH_HOST || secrets.SSH_HOST_EXCHEK_PREPROD }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME_ZOY_QA || secrets.SSH_USERNAME || secrets.SSH_USERNAME_EXCHEK_PREPROD }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ env.SSH_PORT }} -H "$SSH_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config << EOF
          Host target
            HostName $SSH_HOST
            User $SSH_USERNAME
            Port ${{ env.SSH_PORT }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ServerAliveCountMax 20
          EOF

      - name: Stop and remove core containers
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 target bash << 'EOSSH'
            echo "🛑 Stopping core Klero containers (eureka, gateway, auth, customer)..."
            for SVC in klero-eukea-service klero-gateway-service klero-auth-service klero-customer-service; do
              docker stop "$SVC" 2>/dev/null || true
              docker rm --force "$SVC" 2>/dev/null || true
            done
            echo "⏳ Sleeping 10s for ports to release..."
            sleep 10
          EOSSH

  deploy_core:
    name: "🚀 Deploy Core Services (Sequential)"
    runs-on: ubuntu-latest
    needs: [setup, stop_core_klero]
    steps:
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_ZOY_QA || secrets.SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY_EXCHEK_PREPROD }}
          SSH_HOST: ${{ secrets.SSH_HOST_ZOY_QA || secrets.SSH_HOST || secrets.SSH_HOST_EXCHEK_PREPROD }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME_ZOY_QA || secrets.SSH_USERNAME || secrets.SSH_USERNAME_EXCHEK_PREPROD }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ env.SSH_PORT }} -H "$SSH_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config << EOF
          Host target
            HostName $SSH_HOST
            User $SSH_USERNAME
            Port ${{ env.SSH_PORT }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ServerAliveCountMax 20
          EOF

      - name: Deploy klero-eukea-service (Eureka Registry)
        env:
          SHA4: ${{ needs.setup.outputs.sha4 }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 target bash -s "$SHA4" << 'EOSSH'
            set -e
            SHA4="$1"
            SVC="klero-eukea-service"
            PORT=8761
            FULL_IMAGE="${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC}"
            docker stop "$SVC" 2>/dev/null || true
            docker rm --force "$SVC" 2>/dev/null || true
            sleep 3
            docker pull "$FULL_IMAGE"
            docker run -d --name "$SVC" --network host --restart unless-stopped \
              -e SPRING_PROFILES_ACTIVE=${{ env.SPRING_PROFILE }} \
              -e SERVER_PORT=$PORT \
              "$FULL_IMAGE"
            echo "⏳ Waiting 15s for Eureka to initialize..."
            sleep 15
          EOSSH

      - name: Deploy klero-gateway-service
        env:
          SHA4: ${{ needs.setup.outputs.sha4 }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 target bash -s "$SHA4" << 'EOSSH'
            set -e
            SHA4="$1"
            SVC="klero-gateway-service"
            PORT=8080
            FULL_IMAGE="${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC}"
            docker stop "$SVC" 2>/dev/null || true
            docker rm --force "$SVC" 2>/dev/null || true
            sleep 3
            docker pull "$FULL_IMAGE"
            docker run -d --name "$SVC" --network host --restart unless-stopped \
              -e SPRING_PROFILES_ACTIVE=${{ env.SPRING_PROFILE }} \
              -e SERVER_PORT=$PORT \
              -e EUREKA_CLIENT_SERVICEURL_DEFAULTZONE="http://localhost:8761/eureka/" \
              -e EUREKA_INSTANCE_PREFER_IP_ADDRESS=true \
              "$FULL_IMAGE"
          EOSSH

      - name: Deploy klero-customer-service
        env:
          SHA4: ${{ needs.setup.outputs.sha4 }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 target bash -s "$SHA4" << 'EOSSH'
            set -e
            SHA4="$1"
            SVC="klero-customer-service"
            PORT=8082
            FULL_IMAGE="${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC}"
            docker stop "$SVC" 2>/dev/null || true
            docker rm --force "$SVC" 2>/dev/null || true
            sleep 3
            docker pull "$FULL_IMAGE"
            docker run -d --name "$SVC" --network host --restart unless-stopped \
              -e SPRING_PROFILES_ACTIVE=${{ env.SPRING_PROFILE }} \
              -e SERVER_PORT=$PORT \
              -e EUREKA_CLIENT_SERVICEURL_DEFAULTZONE="http://localhost:8761/eureka/" \
              -e EUREKA_INSTANCE_PREFER_IP_ADDRESS=true \
              "$FULL_IMAGE"
          EOSSH

      - name: Deploy klero-auth-service
        env:
          SHA4: ${{ needs.setup.outputs.sha4 }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 target bash -s "$SHA4" << 'EOSSH'
            set -e
            SHA4="$1"
            SVC="klero-auth-service"
            PORT=8086
            FULL_IMAGE="${{ env.DOCKER_IMAGE_REPO }}:${SHA4}-${SVC}"
            docker stop "$SVC" 2>/dev/null || true
            docker rm --force "$SVC" 2>/dev/null || true
            sleep 3
            docker pull "$FULL_IMAGE"
            docker run -d --name "$SVC" --network host --restart unless-stopped \
              -e SPRING_PROFILES_ACTIVE=${{ env.SPRING_PROFILE }} \
              -e SERVER_PORT=$PORT \
              -e EUREKA_CLIENT_SERVICEURL_DEFAULTZONE="http://localhost:8761/eureka/" \
              -e EUREKA_INSTANCE_PREFER_IP_ADDRESS=true \
              "$FULL_IMAGE"
          EOSSH

  deployment_summary:
    name: "📋 Deployment Summary"
    runs-on: ubuntu-latest
    if: always()
    needs: [deploy_core]
    steps:
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_ZOY_QA || secrets.SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY_EXCHEK_PREPROD }}
          SSH_HOST: ${{ secrets.SSH_HOST_ZOY_QA || secrets.SSH_HOST || secrets.SSH_HOST_EXCHEK_PREPROD }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME_ZOY_QA || secrets.SSH_USERNAME || secrets.SSH_USERNAME_EXCHEK_PREPROD }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ env.SSH_PORT }} -H "$SSH_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config << EOF
          Host target
            HostName $SSH_HOST
            User $SSH_USERNAME
            Port ${{ env.SSH_PORT }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ServerAliveCountMax 20
          EOF
      - name: Print status
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 target bash << 'EOSSH'
            echo ""
            echo "╔══════════════════════════════════════════════╗"
            echo "║     KLERO DEV — Core Deployment Summary      ║"
            echo "╚══════════════════════════════════════════════╝"
            echo ""
            echo "🐳 Running klero containers:"
            docker ps --filter "name=klero-" --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
            echo ""
            echo "📦 Exited containers (if any):"
            EXITED=$(docker ps -a --filter "name=klero-" --filter "status=exited" --format " {{.Names}} → {{.Status}}")
            [ -z "$EXITED" ] && echo " None ✅" || echo "$EXITED"
          EOSSH
